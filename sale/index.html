<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sale</title>
<style>

@font-face{font-family:Manrope;font-weight:100 500;src:url(../menu/vendor/fonts/Manrope_500Medium.ttf) format('truetype')}
@font-face{font-family:Manrope;font-weight:600 900;src:url(../menu/vendor/fonts/Manrope_800ExtraBold.ttf) format('truetype')}
:root{--a:#EEF1E4;--b:#D9DECB;--carta:#FFFFFF;--testo:#1B1D17}
:root.scuro{--a:#262A1F;--b:#171A13;--carta:#1D2017;--testo:#E6E5D9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(var(--a),var(--b));font-family:Manrope,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.zoom{position:fixed;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:14px;border:0;background:var(--carta);color:var(--testo);font:700 20px Manrope,system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.14)}
</style>
</head>
<body>
<div class="zoom">
  <button type="button" id="z-piu" aria-label="Avvicina">+</button>
  <button type="button" id="z-meno" aria-label="Allontana">−</button>
  <button type="button" id="z-alto" aria-label="Vista dall'alto o di sbieco">◱</button>
</div>
<script src="../cucine/three.min.js"></script>
<script>
'use strict';

    if (d > 0.0005 || sporco) {   // si ridisegna solo quando qualcosa cambia: a scena ferma il telefono non lavora
      const k = 1 - Math.exp(-dt / 95); st.theta += (mira.theta - st.theta) * k; st.phi += (mira.phi - st.phi) * k; st.zoom += (mira.zoom - st.zoom) * k; st.target.lerp(mira.target, k);
      metti(st.target, st.theta, st.phi, raggio * st.zoom);
      sistemaTag();
      renderer.render(scene, cam); sporco = false; ferma = false;
    } else ferma = true;
    requestAnimationFrame(passo);
  }
  requestAnimationFrame(passo);

  /* dito: trascinare ruota, due dita avvicinano, un tocco sceglie la tavolata */
  const dita = new Map(); let mosso = 0, pizzico = 0;
  const ray = new THREE.Raycaster(), punto = new THREE.Vector2();
  function tocca(x, y){
    const b = canvas.getBoundingClientRect(); punto.set((x - b.left) / b.width * 2 - 1, -((y - b.top) / b.height * 2 - 1)); ray.setFromCamera(punto, cam);
    const hit = ray.intersectObjects(bersagli, false)[0]; if (!hit || !hit.object.userData.id) return;
    evidenzia(hit.object.userData.id); invia({ tipo: 'tavolata', id: hit.object.userData.id });
  }
  canvas.addEventListener('pointerdown', ev => { dita.set(ev.pointerId, { x: ev.clientX, y: ev.clientY }); if (dita.size === 1) mosso = 0; pizzico = 0; try { canvas.setPointerCapture(ev.pointerId); } catch (e) {} });
  canvas.addEventListener('pointermove', ev => {
    const p = dita.get(ev.pointerId); if (!p) return;
    if (dita.size === 1) { const dx = ev.clientX - p.x, dy = ev.clientY - p.y; mosso += Math.abs(dx) + Math.abs(dy); if (mosso >= 10) { toccata = true; mira.theta -= dx * 0.008; mira.phi = clamp(mira.phi - dy * 0.006, 0.02, 1.4); } }
    p.x = ev.clientX; p.y = ev.clientY;
    if (dita.size === 2) { const [a, b] = [...dita.values()], dist = Math.hypot(a.x - b.x, a.y - b.y); if (pizzico) mira.zoom = clamp(mira.zoom * pizzico / dist, 0.2, 1.6); pizzico = dist; mosso = 99; toccata = true; }
  });
  const su = ev => { const era = dita.has(ev.pointerId), solo = dita.size === 1; dita.delete(ev.pointerId); pizzico = 0; if (era && solo && mosso < 10 && ev.type === 'pointerup') tocca(ev.clientX, ev.clientY); };
  ['pointerup', 'pointercancel'].forEach(n => canvas.addEventListener(n, su));
  canvas.addEventListener('wheel', ev => { ev.preventDefault(); toccata = true; mira.zoom = clamp(mira.zoom * (ev.deltaY > 0 ? 1.1 : 0.9), 0.2, 1.6); }, { passive: false });
  document.getElementById('z-piu').addEventListener('click', () => { toccata = true; mira.zoom = clamp(mira.zoom / 1.25, 0.2, 1.6); });
  document.getElementById('z-meno').addEventListener('click', () => { toccata = true; mira.zoom = clamp(mira.zoom * 1.25, 0.2, 1.6); });
  document.getElementById('z-alto').addEventListener('click', () => { dallAlto = !dallAlto; toccata = false; inquadra(false); });

  /* dati dalla suite */
  window.__sala = (dati) => {
    window.__ultimi = dati;
    try {
      document.documentElement.classList.toggle('scuro', !!dati.scuro);
      const nuova = dati.sala.id + '|' + JSON.stringify(dati.sala.contorno);
      if (nuova !== misura) { misura = nuova; costruisciSala(dati.sala); toccata = false; inquadra(true); }
      costruisciTavoli(dati.tavolate);
      evidenzia(dati.scelto && perId[dati.scelto] ? dati.scelto : null);
      sporco = true;
    } catch (e) { invia({ tipo: 'errore', testo: String(e && e.message || e) }); }
  };
  /* per le prove automatiche */
  const sulloSchermo = (v) => { cam.updateMatrixWorld(); v.project(cam); return [(v.x + 1) / 2 * window.innerWidth, (1 - v.y) / 2 * window.innerHeight]; };
  window.__scena = () => ({ tavolate: Object.keys(perId).length, sedie: bersagli.filter(o => o.userData.sedia).length, scelto, sala: misura });
  window.__tocca = tocca;
  window.__ferma = () => ferma;
  window.__schermoTavolata = (id) => { const t = window.__ultimi.tavolate.find(x => x.id === id); return sulloSchermo(new THREE.Vector3(t.x - cx, 0.76, t.y - cy)); };
  window.__schermoTag = (id) => { const v = new THREE.Vector3(); perId[id].sp.getWorldPosition(v); return sulloSchermo(v); };
  window.__schermoPunto = (x, y) => sulloSchermo(new THREE.Vector3(x - cx, 0, y - cy));
  window.__colori = () => { renderer.render(scene, cam); const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, px = new Uint8Array(4), s = new Set();
    for (let i = 1; i < 24; i++) for (let j = 1; j < 24; j++) { gl.readPixels(Math.floor(w * i / 24), Math.floor(h * j / 24), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); if (px[3]) s.add((px[0] >> 4) + ',' + (px[1] >> 4) + ',' + (px[2] >> 4)); } return s.size; };
  // i tag usano Manrope: quando il carattere è pronto si ridisegnano
  if (document.fonts && document.fonts.load) document.fonts.load('800 44px Manrope').then(() => { if (window.__ultimi) window.__sala(window.__ultimi); }).catch(() => {});
  invia({ tipo: 'pronta' });
})();
</script>
