name: Compila APK

on:
  push:
    branches: [main]
    # le modifiche alla sola documentazione non fanno partire una build
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node.js 22 (serve node:sqlite per i test)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa le dipendenze (versioni esatte del file package-lock.json)
        run: npm ci

      - name: Esegui i test
        run: npm test

      - name: Controlla il codice (variabili e import inesistenti, chiavi doppie)
        run: npm run lint

      - name: Prova il modulo Menù in un browser (dati, PDF, aspetto, collegamento con la suite)
        run: |
          pip install --quiet playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          python3 test/menu-suite.py

      - name: Prova la vista 3D delle cucine in un browser (attrezzature, etichette, tocchi)
        run: python3 test/cucine-vista.py

      - name: Prova la vista 3D delle sale in un browser (tavolate, sedie, tocchi)
        run: python3 test/sale-vista.py

      - name: Prova a impacchettare tutte le schermate (trova gli errori in un minuto, prima della build Android)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/esportazione"
        env:
          EXPO_NO_TELEMETRY: 1

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      HA_CHIAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_STORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      # impronta SHA-256 del certificato dell'app (la stessa scritta in CLAUDE.md): non va mai cambiata
      IMPRONTA_ATTESA: '60:70:FD:FC:4C:AC:D6:8B:89:4F:CB:64:D6:8B:D5:F1:0D:0B:00:72:48:F2:31:E5:A8:9B:6A:44:F3:8B:ED:1B'
    steps:
      - name: Controlla che la chiave di firma sia configurata (senza, la build si ferma)
        if: env.HA_CHIAVE != 'true'
        run: |
          echo "::error::Mancano i Secrets di firma (ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
          echo "Un APK firmato con un'altra chiave non si installa sopra l'app esistente: la build si ferma qui."
          exit 1

      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepara Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verifica Android SDK (preinstallato sui runner Ubuntu)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Installa le dipendenze (versioni esatte del file package-lock.json)
        run: npm ci

      - name: Scrivi il numero di build nell'app (visibile in fondo alla Home) e nel versionCode
        run: |
          printf "export const BUILD = '%s';\n" "${{ github.run_number }}" > build.js
          node -e "const f='app.json';const c=JSON.parse(require('fs').readFileSync(f,'utf8'));c.expo.android.versionCode=Number(process.argv[1]);c.expo.version='1.0.'+process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "${{ github.run_number }}"
          cat build.js

      - name: Genera il progetto Android nativo
        run: npx expo prebuild --platform android --clean

      - name: Firma con la chiave dell'app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/haccp.keystore"
          python3 - <<'PY'
          import re, sys
          p = 'android/app/build.gradle'
          s = open(p).read()
          rel = """signingConfigs {
                  release {
                      storeFile file(System.getenv('HACCP_KEYSTORE'))
                      storePassword System.getenv('HACCP_STORE_PASSWORD')
                      keyAlias System.getenv('HACCP_KEY_ALIAS')
                      keyPassword System.getenv('HACCP_KEY_PASSWORD')
                  }"""
          if s.count('signingConfigs {') != 1:
              sys.exit('build.gradle inatteso: blocco signingConfigs non trovato')
          s = s.replace('signingConfigs {', rel, 1)
          i = s.index('release {', s.index('buildTypes {'))
          j = s.index('signingConfig signingConfigs.debug', i)
          s = s[:j] + 'signingConfig signingConfigs.release' + s[j + len('signingConfig signingConfigs.debug'):]
          open(p, 'w').write(s)
          print('Firma release configurata')
          PY

      - name: Compila l'APK
        # di solito bastano 8-10 minuti: se si blocca (successo alla build 81) si ferma da sola invece di restare appesa per ore
        timeout-minutes: 25
        working-directory: android
        env:
          HACCP_KEYSTORE: ${{ runner.temp }}/haccp.keystore
          HACCP_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          HACCP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HACCP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          # una sola architettura (arm64, quella dei telefoni recenti): APK molto più leggero e veloce da pubblicare
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          esito=${PIPESTATUS[0]}
          if [ "$esito" != "0" ]; then
            # le righe che spiegano l'errore finiscono nel riepilogo della build, leggibile senza aprire tutto il log
            righe=$(grep -E "error:|^e: |FAILED|What went wrong|Execution failed|Could not |Unresolved reference|cannot find symbol|Duplicate class|Manifest merger" "$RUNNER_TEMP/gradle.log" | head -12 | cut -c1-280 | sed 's/%/%25/g' | tr '\n' '|')
            echo "::error::Compilazione Android non riuscita: ${righe:-nessuna riga di errore riconosciuta, vedi il log}"
            exit "$esito"
          fi

      - name: Rinomina l'APK con il numero di build
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/tracciabilita-haccp-build-${{ github.run_number }}.apk"

      - name: Mostra con quale chiave è firmato l'APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/*.apk > firma-completa.txt 2>&1 || true
          # le righe cambiano con la versione di apksigner ("Signer #1 ..." oppure "Signer (minSdkVersion=...) ..."):
          # si cercano quelle del certificato, comunque inizino
          grep -E "certificate (DN|SHA-256 digest)" firma-completa.txt | tee firma.txt || true
          # l'impronta deve essere quella dell'app: altrimenti l'APK non si installerebbe sopra i dati esistenti
          trovata=$(grep "certificate SHA-256 digest" firma.txt | grep -oiE '[0-9a-f]{64}' | tr 'A-F' 'a-f' | sort -u || true)
          attesa=$(printf '%s' "$IMPRONTA_ATTESA" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ "$trovata" != "$attesa" ]; then
            echo "::error::Impronta della firma diversa da quella attesa: l'APK non viene pubblicato. Trovata: $(printf '%s' "${trovata:-nessuna}" | tr '\n' ' ') - Attesa: $attesa - Risposta di apksigner: $(head -c 400 firma-completa.txt | tr '\n' '|')"
            exit 1
          fi
          echo "Impronta corretta."

      - name: Mostra la dimensione dell'APK
        run: ls -lh dist/

      - name: Pubblica l'APK come Release (download diretto dal telefono)
        id: release
        continue-on-error: true
        timeout-minutes: 10
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Commit: ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: dist/*.apk
          make_latest: true

      - name: Riprova la pubblicazione se l'upload non è riuscito
        if: steps.release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          gh release create "$TAG" --title "Build ${{ github.run_number }}" --notes "Commit: ${{ github.sha }}" || true
          for tentativo in 1 2 3; do
            if timeout 600 gh release upload "$TAG" dist/*.apk --clobber; then
              echo "APK pubblicato al tentativo $tentativo"
              exit 0
            fi
            sleep 20
          done
          echo "Pubblicazione della Release non riuscita: l'APK resta disponibile come artifact."
          exit 1

      - name: Conserva anche l'artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: tracciabilita-haccp-apk
          path: dist/*.apk
          retention-days: 7
