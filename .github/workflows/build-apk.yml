name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node.js 22 (serve node:sqlite per i test)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa le dipendenze
        run: npm install

      - name: Esegui i test
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      HA_CHIAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepara Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verifica Android SDK (preinstallato sui runner Ubuntu)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Installa le dipendenze
        run: npm install

      - name: Genera il progetto Android nativo
        run: npx expo prebuild --platform android --clean

      - name: Firma con la chiave dell'app (solo se configurata nei Secrets)
        if: env.HA_CHIAVE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/haccp.keystore"
          python3 - <<'PY'
          import re, sys
          p = 'android/app/build.gradle'
          s = open(p).read()
          rel = """signingConfigs {
                  release {
                      storeFile file(System.getenv('HACCP_KEYSTORE'))
                      storePassword System.getenv('HACCP_STORE_PASSWORD')
                      keyAlias System.getenv('HACCP_KEY_ALIAS')
                      keyPassword System.getenv('HACCP_KEY_PASSWORD')
                  }"""
          if s.count('signingConfigs {') != 1:
              sys.exit('build.gradle inatteso: blocco signingConfigs non trovato')
          s = s.replace('signingConfigs {', rel, 1)
          i = s.index('release {', s.index('buildTypes {'))
          j = s.index('signingConfig signingConfigs.debug', i)
          s = s[:j] + 'signingConfig signingConfigs.release' + s[j + len('signingConfig signingConfigs.debug'):]
          open(p, 'w').write(s)
          print('Firma release configurata')
          PY

      - name: Compila l'APK
        working-directory: android
        env:
          HACCP_KEYSTORE: ${{ runner.temp }}/haccp.keystore
          HACCP_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          HACCP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HACCP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          # una sola architettura (arm64, quella dei telefoni recenti): APK molto più leggero e veloce da pubblicare
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rinomina l'APK con il numero di build
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/tracciabilita-haccp-build-${{ github.run_number }}.apk"

      - name: Mostra con quale chiave è firmato l'APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/*.apk | grep -E "Signer #1 certificate (DN|SHA-256)" | tee firma.txt || echo "Impossibile leggere la firma (non bloccante)"

      - name: Mostra la dimensione dell'APK
        run: ls -lh dist/

      - name: Pubblica l'APK come Release (download diretto dal telefono)
        id: release
        continue-on-error: true
        timeout-minutes: 10
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Commit: ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: dist/*.apk
          make_latest: true

      - name: Riprova la pubblicazione se l'upload non è riuscito
        if: steps.release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          gh release create "$TAG" --title "Build ${{ github.run_number }}" --notes "Commit: ${{ github.sha }}" || true
          for tentativo in 1 2 3; do
            if timeout 600 gh release upload "$TAG" dist/*.apk --clobber; then
              echo "APK pubblicato al tentativo $tentativo"
              exit 0
            fi
            sleep 20
          done
          echo "Pubblicazione della Release non riuscita: l'APK resta disponibile come artifact."
          exit 1

      - name: Conserva anche l'artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: tracciabilita-haccp-apk
          path: dist/*.apk
          retention-days: 7
