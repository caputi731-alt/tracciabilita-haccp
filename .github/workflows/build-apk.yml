name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepara Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepara Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa le dipendenze
        run: npm install

      - name: Genera il progetto Android nativo
        run: npx expo prebuild --platform android --clean

      - name: Compila l'APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rinomina l'APK con il numero di build
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/tracciabilita-haccp-build-${{ github.run_number }}.apk"

      - name: Pubblica l'APK come Release (download diretto dal telefono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Commit: ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: dist/*.apk
          make_latest: true

      - name: Conserva anche l'artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: tracciabilita-haccp-apk
          path: dist/*.apk
          retention-days: 7
