name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa EAS
        run: npm install -g eas-cli

      - name: Installa le dipendenze
        run: npm install

      - name: Collega il progetto a Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --non-interactive --force

      - name: Compila l'APK sui server Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json

      - name: Recupera l'APK
        run: |
          URL=$(node -e "try{const b=require('./build.json');const a=Array.isArray(b)?b[0]:b;process.stdout.write((a.artifacts&&a.artifacts.buildUrl)||'')}catch(e){process.stdout.write('')}")
          if [ -n "$URL" ]; then
            echo "Scarico l'APK da: $URL"
            curl -L "$URL" -o tracciabilita-haccp.apk
          else
            echo "APK non scaricato in automatico. Lo trovi comunque su https://expo.dev nella sezione Builds del progetto."
          fi

      - name: Pubblica l'APK scaricabile
        if: ${{ hashFiles('tracciabilita-haccp.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tracciabilita-haccp-apk
          path: tracciabilita-haccp.apk
          retention-days: 30
